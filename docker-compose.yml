services:

  # ─────────────────────────────────────────
  # MySQL 数据库
  # ─────────────────────────────────────────
  mysql:
    image: mysql:5.7.16
    container_name: pbcmanage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pbc_manage}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - /home/data/mysql_data:/var/lib/mysql
      - ./database/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
      # 首次启动时自动按字母顺序执行所有迁移脚本
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # 可选：暴露给宿主机（生产环境可注释掉以提高安全性）
      - "3306:3306"
    networks:
      - pbcmanage-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────
  # NestJS 后端
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbcmanage-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-pbc_manage}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://pbc.das-security.cn}
    networks:
      - pbcmanage-network
    # 后端仅对内部网络暴露，不直接对外（通过 Nginx 代理）
    # 若需直接访问后端 API，取消以下注释：
    # ports:
    #   - "3001:3001"

  # ─────────────────────────────────────────
  # React 前端（Nginx）
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # REACT_APP_API_URL 默认为 /api（经 Nginx 代理转发到后端）
        REACT_APP_API_URL: /api
    container_name: pbcmanage-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - pbcmanage-network

# ─────────────────────────────────────────
# 持久化卷
# ─────────────────────────────────────────
volumes:
  mysql_data:
    name: pbcmanage-mysql-data

# ─────────────────────────────────────────
# 内部网络
# ─────────────────────────────────────────
networks:
  pbcmanage-network:
    driver: bridge
